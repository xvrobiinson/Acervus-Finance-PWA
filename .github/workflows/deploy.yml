# Production pipeline: every push to main is checked, then deployed.
# Order matters: Convex first (schema, functions, and the app build pointed at
# the production backend), then the built app to Cloudflare Workers.
# There are no preview deployments. Setup: docs/DEPLOYMENT.md.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    name: Typecheck and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  deploy:
    name: Deploy to Convex and Cloudflare
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.SITE_URL }}
    env:
      CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      VITE_GOOGLE_SIGN_IN: ${{ vars.VITE_GOOGLE_SIGN_IN }}
      SITE_URL: ${{ vars.SITE_URL }}
    steps:
      - name: Check the deployment secrets are set
        run: |
          missing=""
          for name in CONVEX_DEPLOY_KEY CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing GitHub secrets:$missing. Add them in Settings > Secrets and variables > Actions (docs/DEPLOYMENT.md, part 5)."
            exit 1
          fi
          # A space or line break pasted with a value breaks Wrangler and the
          # environment link. Names only; values are never printed.
          for name in CONVEX_DEPLOY_KEY CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [[ "${!name}" =~ [[:space:]] ]]; then
              echo "::error::The GitHub secret $name contains a space or line break. Paste it again without one (docs/DEPLOYMENT.md, part 5)."
              exit 1
            fi
          done
          if ! [[ "$SITE_URL" =~ ^https://[a-z0-9.-]+\.[a-z]+$ ]]; then
            echo "::error::The GitHub variable SITE_URL must be the app's full address, like https://acervus-finance-pwa.<subdomain>.workers.dev, with no slash, space or line break at the end."
            exit 1
          fi
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Deploy Convex and build the app against it
        run: npm run deploy:backend
      - name: Publish the app to Cloudflare Workers
        run: npm run deploy:frontend
